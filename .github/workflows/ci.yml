name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the job only needs to read the repository
permissions:
  contents: read

defaults:
  run:
    working-directory: netflix_clone

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # the full Playwright suite (288 tests, two builds) takes 11–15 minutes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: netflix_clone/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: netflix_clone/playwright-report/
          retention-days: 14

  # Builds a throwaway local Supabase (Docker) from supabase/migrations, non_transactional/ and seeds/, then runs the
  # pgTAP tests in supabase/tests: access rules, triggers, the cleanup job and indexes. No secrets or hosted project.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Start the local database
        run: supabase db start

      - name: Apply migrations and test data
        run: supabase db reset --local

      - name: Add indexes (CREATE INDEX CONCURRENTLY can't run inside a migration)
        run: for f in supabase/non_transactional/*.sql; do psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"; done

      - name: Database tests
        run: supabase test db
